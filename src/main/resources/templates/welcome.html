<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #e8f5e9; }
        .welcome-container { background: white; padding: 3rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .btn-logout { margin-top: 20px; display: inline-block; padding: 10px 20px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px; }
        .btn-logout:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="welcome-container">
    <!-- Thymeleaf recibe el 'nombreUsuario' desde el Controlador y lo imprime aquí -->
    <h1>¡Hola, <span th:text="${nombreUsuario}">Usuario</span>!</h1>
    <p>Has iniciado sesión correctamente.</p>

    <a href="/login" class="btn-logout">Cerrar Sesión</a>
</div>

</body>
</html>
